<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="280" rx="16" fill="#030303"/>

  <!-- corner webs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1">
    <path d="M0 0 L200 90 M0 0 L170 160 M0 0 L110 220 M0 0 L40 260"/>
    <path d="M10 10 Q 60 40 60 100 Q 60 160 10 200"/>
    <path d="M35 4 Q 90 55 90 125 Q 90 190 40 240"/>
    <path d="M65 0 Q 125 70 125 145 Q 125 215 70 270"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" transform="translate(900 0) scale(-1 1)">
    <path d="M0 0 L200 90 M0 0 L170 160 M0 0 L110 220 M0 0 L40 260"/>
    <path d="M10 10 Q 60 40 60 100 Q 60 160 10 200"/>
    <path d="M35 4 Q 90 55 90 125 Q 90 190 40 240"/>
  </g>

  <!-- title -->
  <text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    <tspan fill="#ef4444">Spider</tspan> Portfolio
  </text>
  <text x="450" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9ca3af">
    Ammar Elshafey · Full-Stack Web Developer
  </text>

  <!-- glowing underline -->
  <rect x="380" y="190" width="140" height="3" rx="1.5" fill="#ef4444">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="60;140;60" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="420;380;420" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- swinging spider -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 450 0;7 450 0;-7 450 0" dur="4s" repeatCount="indefinite"/>
    <line x1="450" y1="0" x2="450" y2="228" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <g transform="translate(450 244)" fill="#ef4444" stroke="#ef4444">
      <g fill="none" stroke-width="2" stroke-linecap="round">
        <path d="M-7 -4 L-22 -14 M-8 0 L-26 0 M-7 5 L-22 15"/>
        <path d="M7 -4 L22 -14 M8 0 L26 0 M7 5 L22 15"/>
      </g>
      <ellipse cx="0" cy="5" rx="9" ry="11" stroke="none"/>
      <circle cx="0" cy="-8" r="6" stroke="none"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
