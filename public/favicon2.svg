<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Red Background Gradient -->
    <radialGradient id="suitBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#B80009" />
      <stop offset="100%" stop-color="#4A0004" />
    </radialGradient>

    <!-- Outer Rim Metallic Shadow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Lens Frame Matte Black Texture -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2D30" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>

    <!-- Web Mesh Pattern Overlay -->
    <pattern id="suitTexture" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 8 L 8 16 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Icon Frame (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#rimGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#suitBg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#suitTexture)" />

  <!-- High-Tech Cinematic Web Lines -->
  <g stroke="#1A0103" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <!-- Center Web Spokes -->
    <line x1="256" y1="256" x2="256" y2="12" />
    <line x1="256" y1="256" x2="480" y2="88" />
    <line x1="256" y1="256" x2="490" y2="330" />
    <line x1="256" y1="256" x2="350" y2="495" />
    <line x1="256" y1="256" x2="162" y2="495" />
    <line x1="256" y1="256" x2="22" y2="330" />
    <line x1="256" y1="256" x2="32" y2="88" />

    <!-- Curved Web Ring Arcs -->
    <path d="M 180 170 Q 256 140 332 170" fill="none" />
    <path d="M 120 256 Q 256 210 392 256" fill="none" />
    <path d="M 150 350 Q 256 310 362 350" fill="none" />
    <path d="M 180 430 Q 256 400 332 430" fill="none" />
  </g>

  <!-- Central Spider Emblem Background Accent -->
  <path d="M 256 210 L 268 240 L 298 248 L 272 268 L 280 298 L 256 280 L 232 298 L 240 268 L 214 248 L 244 240 Z" fill="#0A0A0C" opacity="0.3" />

  <!-- LENSES GROUP -->
  <g filter="url(#lensGlow)">
    <!-- LEFT EYE FRAME (Matte Black Frame) -->
    <path d="M 242 185 
             C 165 105, 55 175, 55 285 
             C 55 385, 195 400, 242 400 
             C 230 340, 230 245, 242 185 Z" 
          fill="url(#frameGrad)" 
          stroke="#000000" 
          stroke-width="4" />

    <!-- LEFT EYE GLASS -->
    <path d="M 233 202 
             C 170 132, 78 190, 78 283 
             C 78 363, 195 377, 232 377 
             C 222 328, 222 250, 233 202 Z" 
          fill="url(#glassGrad)" />

    <!-- RIGHT EYE FRAME (Matte Black Frame) -->
    <path d="M 270 185 
             C 347 105, 457 175, 457 285 
             C 457 385, 317 400, 270 400 
             C 282 340, 282 245, 270 185 Z" 
          fill="url(#frameGrad)" 
          stroke="#000000" 
          stroke-width="4" />

    <!-- RIGHT EYE GLASS -->
    <path d="M 279 202 
             C 342 132, 434 190, 434 283 
             C 434 363, 317 377, 280 377 
             C 290 328, 290 250, 279 202 Z" 
          fill="url(#glassGrad)" />
  </g>

  <!-- Glass Sheen / Reflection Accents -->
  <path d="M 95 240 C 120 180, 180 150, 215 155 C 190 180, 140 210, 110 265 Z" fill="#FFFFFF" opacity="0.35" />
  <path d="M 417 240 C 392 180, 332 150, 297 155 C 322 180, 372 210, 402 265 Z" fill="#FFFFFF" opacity="0.35" />
</svg>
